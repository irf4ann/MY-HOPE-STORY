{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-16 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <h1 class="text-3xl font-bold text-slate-900">Profile</h1>
        <p class="mt-2 text-slate-600">You are signed in as {{ user.username }}.</p>
        <div class="mt-8 grid gap-4 sm:grid-cols-2">
            <div class="rounded-xl border border-slate-200 p-4">
                <p class="text-sm font-medium text-slate-500">Username</p>
                <p class="mt-1 text-lg font-semibold text-slate-900">{{ user.username }}</p>
            </div>
            <div class="rounded-xl border border-slate-200 p-4">
                <p class="text-sm font-medium text-slate-500">Email</p>
                <p class="mt-1 text-lg font-semibold text-slate-900">{{ user.email|default:'Not provided' }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
