services:
  - type: web
    name: myhopestory
    env: python
    plan: free
    buildCommand: ./render_build.sh
    startCommand: ./render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: myhopestory-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com

      - key: REDIS_URL
        fromService:
          type: redis
          name: redistogo
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: redistogo
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: redistogo
          property: connectionString


  - type: redis
    name: redistogo
    plan: free

  - type: pserv
    name: myhopestory-celery
    env: python
    plan: free
    buildCommand: ./render_build.sh
    startCommand: ./render_celery.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: myhopestory-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redistogo
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: redistogo
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: redistogo
          property: connectionString


databases:
  - name: myhopestory-db
    plan: free
    databaseName: myhopestory
    user: myhopestory
